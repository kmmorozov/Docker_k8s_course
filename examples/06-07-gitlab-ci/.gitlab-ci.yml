# =============================================================================
# Полный конвейер пособия (модули 6-7):
#   validate (lint, unit) -> build (dind) -> test (integration)
#   -> security (gitleaks, hadolint, trivy) -> deploy (staging auto, prod manual)
# Предварительно (Settings -> CI/CD -> Variables):
#   STAGING_SSH_PRIVATE_KEY, PROD_SSH_PRIVATE_KEY  (protected, masked)
# =============================================================================

stages:
  - validate
  - build
  - test
  - security
  - deploy

default:
  image: alpine:3.20

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

variables:
  IMAGE: "$CI_REGISTRY_IMAGE/myapp"

# ---------- Валидация ----------
lint:
  stage: validate
  image: python:3.12-slim
  script:
    - pip install ruff
    - ruff check .

unit-tests:
  stage: validate
  image: python:3.12-slim
  cache:
    key: pip-cache
    paths:
      - .pip-cache
  script:
    - pip install --cache-dir .pip-cache -r requirements.txt
    - pip install pytest
    - pytest -v --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

# ---------- Сборка образа (docker executor + dind) ----------
build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    # Тег: main-a1b2c3d для веток, semver для релизов по git-тегу
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then IMAGE_TAG="$CI_COMMIT_TAG";
      else IMAGE_TAG="$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"; fi
    - docker build --cache-from "$IMAGE:latest" -t "$IMAGE:$IMAGE_TAG" .
    - docker push "$IMAGE:$IMAGE_TAG"
    - echo "IMAGE_TAG=$IMAGE_TAG" >> image.env        # тег дальше по пайплайну
  artifacts:
    reports:
      dotenv: image.env

# ---------- Тестирование на docker-стенде ----------
integration-tests:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - job: build-image
      artifacts: true            # нужен IMAGE_TAG из dotenv-артефакта
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    - docker network create test-net
    - docker run -d --name db --network test-net -e POSTGRES_PASSWORD=test postgres:16-alpine
    - docker run -d --name app --network test-net "$IMAGE:$IMAGE_TAG"
    - |
      for i in $(seq 1 30); do
        if docker exec app python -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"; then break; fi
        sleep 2
      done
    # Контейнер-тестировщик в той же сети обращается к сервисам по имени
    - docker run --rm --network test-net -e BASE_URL=http://app:8000 "$CI_REGISTRY_IMAGE/test-runner:latest"

# ---------- Безопасность ----------
gitleaks:
  stage: security
  image: zricethezav/gitleaks:latest
  script:
    - gitleaks detect --source . --verbose --redact
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint-dockerfile:
  stage: security
  image: hadolint/hadolint:latest-alpine
  script:
    - hadolint Dockerfile

trivy-scan:
  stage: security
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - job: build-image
      artifacts: true
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    - docker pull "$IMAGE:$IMAGE_TAG"
    - |
      docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
        aquasec/trivy:latest image \
        --severity CRITICAL,HIGH --exit-code 1 --no-progress \
        "$IMAGE:$IMAGE_TAG"

# ---------- Развёртывание ----------
deploy-staging:
  stage: deploy
  needs:
    - job: build-image
      artifacts: true
    - job: integration-tests
    - job: trivy-scan
  before_script:
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && ssh-keyscan -H staging.example.com >> ~/.ssh/known_hosts
  script:
    - ssh deploy@staging.example.com "set -e;
        echo '$CI_REGISTRY_PASSWORD' | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY;
        docker pull $IMAGE:$IMAGE_TAG;
        docker stop myapp || true;
        docker rm myapp || true;
        docker run -d --name myapp --restart unless-stopped -p 80:8000 $IMAGE:$IMAGE_TAG;
        docker image prune -f"
    # Smoke-test после деплоя
    - curl -fsS --retry 10 --retry-delay 5 --retry-all-errors https://staging.example.com/health
  environment:
    name: staging
    url: https://staging.example.com

deploy-production:
  stage: deploy
  needs:
    - job: build-image
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && ssh-keyscan -H example.com >> ~/.ssh/known_hosts
  script:
    - ssh deploy@example.com "set -e;
        echo '$CI_REGISTRY_PASSWORD' | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY;
        docker pull $IMAGE:$IMAGE_TAG;
        docker stop myapp || true;
        docker rm myapp || true;
        docker run -d --name myapp --restart unless-stopped -p 80:8000 $IMAGE:$IMAGE_TAG;
        docker image prune -f"
  environment:
    name: production
    url: https://example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
