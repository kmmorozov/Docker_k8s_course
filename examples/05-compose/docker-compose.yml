# Стек из пособия 5.3: app + PostgreSQL + Redis + Nginx + one-shot миграция
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VERSION=1.0.0
    container_name: app
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      - DB_HOST=db            # сервисы резолвятся по имени
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - REDIS_HOST=redis
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - frontend
      - backend
    volumes:
      - app-data:/data
    secrets:
      - db_password
    healthcheck:
      # curl нет в python:slim — проверка через стандартную библиотеку
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password   # postgres поддерживает *_FILE
      POSTGRES_DB: appdb
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend          # НЕ в frontend: минимизация доступности
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - db_password

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb"]
    volumes:
      - redis-data:/data
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - frontend

  # Одноразовая задача: стартует только с --profile migrate
  migrate:
    build: .
    command: ["python", "-c", "print('run your migrations here')"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    profiles: ["migrate"]

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  app-data:
  db-data:
  redis-data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
