# NetworkPolicy: только frontend может ходить в backend (пособие 8.9)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: staging
spec:
  podSelector:
    matchLabels:
      app: shop
      tier: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: shop
              tier: frontend
      ports:
        - protocol: TCP
          port: 80
