# Init-контейнер: ждём БД перед стартом приложения (пособие 8.4)
apiVersion: v1
kind: Pod
metadata:
  name: myapp-with-init
  labels: { app: myapp }
spec:
  initContainers:
    - name: wait-for-db
      image: busybox:1.36
      command: ['sh', '-c', 'until nc -z db 5432; do sleep 2; done']
  containers:
    - name: app
      image: registry.example.com/myapp:1.4.2
      ports: [{ containerPort: 8000 }]
