# Под с одним контейнером (пособие 8.4)
apiVersion: v1
kind: Pod
metadata:
  name: myapp
  labels:
    app: myapp            # метки — основа селекторов Service/Ingress
spec:
  containers:
    - name: app
      image: nginx:1.27
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
